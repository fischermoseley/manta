name: run_tests
on: [push]
jobs:
  all:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: |
          uv python install
          uv sync --locked

      - name: Run pre-commit against all files
        run: make pre-commit

      - name: Run tests
        run: |
          source .env
          make test
          cat coverage.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage_reports_py${{ matrix.python-version }}
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml
            coverage.md
